<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バドミントン 対戦表</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2733;--sub:#667085;--main:#0b7a5b;--line:#dde3ea}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--card:#1a222b;--text:#e8edf2;--sub:#97a3b0;--main:#33b58e;--line:#2c3743}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--sub);margin:8px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--main);color:#fff;font-weight:600;width:100%;margin-top:10px}
button.sub{background:transparent;color:var(--main);border:1px solid var(--main)}
button:disabled{opacity:.4}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;margin:0;padding:8px;font-size:20px}
.stepper span{flex:1;text-align:center;font-size:22px;font-weight:700}
.court-card{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--bg)}
.court-title{font-size:13px;color:var(--sub);margin-bottom:6px}
.vsrow{display:flex;align-items:center;gap:8px}
.vsrow .vs{color:var(--sub);font-weight:700}
.win{flex:1;margin:0;padding:14px 4px;background:var(--c);line-height:1.3}
.win small{display:block;font-weight:400;font-size:12px;opacity:.9}
.idle{color:var(--sub);padding:8px 0;text-align:center}
.progress{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:6px 0}
.progress i{display:block;height:100%;background:var(--main)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line)}
.hide{display:none}
.note{font-size:13px;color:var(--sub)}
.done{font-weight:700;color:var(--main);text-align:center;padding:6px}
.log{font-size:13px;color:var(--sub);max-height:180px;overflow:auto}
</style>
</head>
<body>
<h1>🏸 バドミントン 対戦表</h1>

<div class="card" id="setup">
  <h2>設定</h2>
  <div class="row">
    <div><label>チーム数</label>
      <div class="stepper"><button class="sub" data-t="teams" data-d="-1">−</button><span id="v-teams">4</span><button class="sub" data-t="teams" data-d="1">＋</button></div></div>
    <div><label>コート数</label>
      <div class="stepper"><button class="sub" data-t="courts" data-d="-1">−</button><span id="v-courts">2</span><button class="sub" data-t="courts" data-d="1">＋</button></div></div>
  </div>
  <div class="note" id="count"></div>
  <button id="go">試合開始（総当たり1周）</button>
</div>

<div id="play" class="hide">
  <div class="card">
    <h2>試合中</h2>
    <div id="prog-text" class="note"></div>
    <div class="progress"><i id="prog-bar"></i></div>
    <div id="courts"></div>
    <div id="finished" class="done hide">🎉 総当たり終了！</div>
    <button class="sub" id="undo">1つ前の結果を取り消す</button>
  </div>
  <div class="card"><h2>成績</h2><div id="stats"></div></div>
  <div class="card"><h2>結果</h2><div id="log" class="log"></div>
    <button class="sub" id="reset">最初からやり直す</button></div>
</div>

<script>
/* ===== ロジック（テスト用に LOGIC_START〜LOGIC_END を単体で取り出せる） ===== */
// LOGIC_START
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// 総当たり：全組み合わせを1回ずつ。コートが空くたびに、次の試合を1つ選んで入れる。
// 対戦順は円形法（サークル法）：1周目で全チームが1試合ずつ、2周目で全チームが次の1試合ずつ…と進む。
// チーム番号を最初にシャッフルするので、毎回違う順番になる。奇数チームは1チームずつ休み（不戦）が回る。
function circleOrder(T){
  let arr=shuffle([...Array(T).keys()]);if(T%2)arr.push(null);
  const n=arr.length,out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){
      const a=arr[i],b=arr[n-1-i];
      if(a!==null&&b!==null)out.push(a<b?[a,b]:[b,a]);
    }
    arr=[arr[0],arr[n-1],...arr.slice(1,n-1)];
  }
  return out;
}
function newGame(T,courts){
  const remaining=circleOrder(T);
  const g={T,total:remaining.length,remaining,courts:Array(Math.min(courts,Math.floor(T/2))).fill(null),
    started:Array(T).fill(0),idle:Array(T).fill(0),tick:0,wins:Array(T).fill(0),losses:Array(T).fill(0),results:[]};
  fill(g);return g;
}
// 次の試合：円形法の順番で、今コートにいないチーム同士の最初の試合。
function pickNext(g){
  const busy=new Set();g.courts.forEach(c=>{if(c){busy.add(c[0]);busy.add(c[1]);}});
  return g.remaining.findIndex(([a,b])=>!busy.has(a)&&!busy.has(b));
}
function fill(g){
  for(let c=0;c<g.courts.length;c++){
    if(g.courts[c])continue;
    const i=pickNext(g);if(i<0)continue;
    const p=g.remaining.splice(i,1)[0];
    g.courts[c]=p;g.started[p[0]]++;g.started[p[1]]++;
  }
}
function finish(g,court,winner){
  const [a,b]=g.courts[court];const loser=winner===a?b:a;
  g.wins[winner]++;g.losses[loser]++;g.results.push([a,b,winner]);
  g.courts[court]=null;g.tick++;g.idle[a]=g.idle[b]=g.tick;
  fill(g);
}
function isOver(g){return g.remaining.length===0&&g.courts.every(c=>!c);}
// LOGIC_END

/* ===== 画面 ===== */
const $=id=>document.getElementById(id);
const state={teams:4,courts:2};
const LIM={teams:[2,20],courts:[1,10]};
let game=null,hist=[];
const color=t=>`hsl(${(t*137.5)%360},55%,42%)`;
const nm=t=>'チーム'+(t+1);

function load(){try{const s=JSON.parse(localStorage.getItem('bd3')||'null');if(s){Object.assign(state,s.state);game=s.game;hist=s.hist||[];}}catch(e){}}
function save(){try{localStorage.setItem('bd3',JSON.stringify({state,game,hist}));}catch(e){}}
function refreshSetup(){
  state.courts=Math.max(1,Math.min(state.courts,Math.floor(state.teams/2)));
  $('v-teams').textContent=state.teams;$('v-courts').textContent=state.courts;
  const T=state.teams;
  $('count').textContent=`総当たり ${T*(T-1)/2} 試合（各チーム ${T-1} 試合）／ 同時に使えるコートは最大${Math.floor(T/2)}面`;
  save();
}
document.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.t,[lo,hi]=LIM[k];
  const hiK=k==='courts'?Math.min(hi,Math.floor(state.teams/2)):hi;
  state[k]=Math.max(lo,Math.min(hiK,state[k]+Number(b.dataset.d)));refreshSetup();
});

function render(){
  $('setup').classList.toggle('hide',!!game);
  $('play').classList.toggle('hide',!game);
  if(!game)return;
  const g=game,done=g.results.length;
  $('prog-text').textContent=`${done} / ${g.total} 試合 終了　（残り ${g.total-done} 試合）`;
  $('prog-bar').style.width=(done/g.total*100)+'%';
  $('courts').innerHTML=g.courts.map((c,i)=>{
    const head=`<div class="court-title">コート${i+1}</div>`;
    if(!c)return `<div class="court-card">${head}<div class="idle">${isOver(g)?'—':'待機中（出られるチームがいません）'}</div></div>`;
    return `<div class="court-card">${head}<div class="vsrow">`+
      `<button class="win" style="--c:${color(c[0])}" data-c="${i}" data-w="${c[0]}">${nm(c[0])}<small>勝ち</small></button>`+
      `<span class="vs">VS</span>`+
      `<button class="win" style="--c:${color(c[1])}" data-c="${i}" data-w="${c[1]}">${nm(c[1])}<small>勝ち</small></button></div></div>`;
  }).join('');
  $('finished').classList.toggle('hide',!isOver(g));
  $('undo').disabled=hist.length===0;
  const order=[...Array(g.T).keys()].sort((a,b)=>g.wins[b]-g.wins[a]||a-b);
  $('stats').innerHTML='<table><tr><th>順位</th><th>チーム</th><th>勝</th><th>負</th><th>残り</th></tr>'+
    order.map((t,r)=>{
      const left=g.remaining.filter(p=>p.includes(t)).length+g.courts.filter(c=>c&&c.includes(t)).length;
      return `<tr><td>${r+1}</td><td>${nm(t)}</td><td>${g.wins[t]}</td><td>${g.losses[t]}</td><td>${left}</td></tr>`;}).join('')+'</table>';
  $('log').innerHTML=g.results.length?g.results.slice().reverse().map(([a,b,w],i)=>
    `${g.results.length-i}. ${nm(a)} VS ${nm(b)} → <b>${nm(w)}</b> 勝ち`).join('<br>'):'まだ結果はありません';
  save();
}
$('courts').onclick=e=>{
  const b=e.target.closest('button.win');if(!b)return;
  hist.push(JSON.stringify(game));if(hist.length>200)hist.shift();
  finish(game,Number(b.dataset.c),Number(b.dataset.w));render();
};
$('undo').onclick=()=>{if(hist.length){game=JSON.parse(hist.pop());render();}};
$('go').onclick=()=>{game=newGame(state.teams,state.courts);hist=[];render();};
$('reset').onclick=()=>{if(confirm('最初からやり直しますか？今までの結果は消えます。')){game=null;hist=[];render();}};
load();refreshSetup();render();
</script>
</body>
</html>
