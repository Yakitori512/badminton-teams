<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>バドミントン 対戦表</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#1d2733;--sub:#667085;--main:#0b7a5b;--line:#dde3ea}
@media (prefers-color-scheme:dark){:root{--bg:#10151a;--card:#1a222b;--text:#e8edf2;--sub:#97a3b0;--main:#33b58e;--line:#2c3743}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,"Hiragino Sans",sans-serif;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:4px 0 12px}
h2{font-size:16px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--sub);margin:8px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
button{font-size:16px;padding:12px;border:0;border-radius:10px;background:var(--main);color:#fff;font-weight:600;width:100%;margin-top:10px}
button.sub{background:transparent;color:var(--main);border:1px solid var(--main)}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;margin:0;padding:8px;font-size:20px}
.stepper span{flex:1;text-align:center;font-size:22px;font-weight:700}
.round{margin:8px 0;padding-top:8px;border-top:1px solid var(--line)}
.match{display:flex;align-items:center;gap:6px;padding:4px 0}
.court{font-size:12px;color:var(--sub);width:48px;flex:none}
.chip{flex:1;text-align:center;padding:6px 4px;border-radius:8px;color:#fff;font-weight:600;background:var(--c)}
.vs{color:var(--sub);font-size:13px;font-weight:700}
.rest{font-size:13px;color:var(--sub)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:4px 6px;text-align:center;border-bottom:1px solid var(--line)}
.hide{display:none}
.note{font-size:13px;color:var(--sub)}
</style>
</head>
<body>
<h1>🏸 バドミントン 対戦表</h1>

<div class="card">
  <h2>設定</h2>
  <div class="row">
    <div><label>チーム数</label>
      <div class="stepper"><button class="sub" data-t="teams" data-d="-1">−</button><span id="v-teams">4</span><button class="sub" data-t="teams" data-d="1">＋</button></div></div>
    <div><label>コート数</label>
      <div class="stepper"><button class="sub" data-t="courts" data-d="-1">−</button><span id="v-courts">2</span><button class="sub" data-t="courts" data-d="1">＋</button></div></div>
  </div>
  <label>試合数（1試合＝全コート同時に対戦）</label>
  <div class="stepper"><button class="sub" data-t="rounds" data-d="-1">−</button><span id="v-rounds">4</span><button class="sub" data-t="rounds" data-d="1">＋</button></div>
  <div class="note" id="count"></div>
  <button id="go">対戦表を作る</button>
</div>

<div id="out" class="hide">
  <div class="card"><h2>対戦表</h2><div id="sched"></div></div>
  <div class="card"><h2>試合数の確認</h2><div id="stats"></div></div>
</div>

<script>
/* ===== ロジック（テスト用に LOGIC_START〜LOGIC_END を単体で取り出せる） ===== */
// LOGIC_START
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// 対戦表：毎ラウンド「試合数が少ない順→休みが長い順」でチームを選び、同じ相手が続かないように組む。
// 1ラウンドに使うコート数 = min(コート数, floor(チーム数/2))
function makeSchedule(teamCount,courts,rounds){
  let best=null,bestScore=Infinity;
  for(let trial=0;trial<200;trial++){
    const s=buildOnce(teamCount,courts,rounds);
    if(s.score<bestScore){best=s;bestScore=s.score;}
    if(bestScore===0)break;
  }
  return best;
}
function buildOnce(T,courts,rounds){
  const m=Math.min(courts,Math.floor(T/2));
  const games=Array(T).fill(0),last=Array(T).fill(-1);
  const vs=Array.from({length:T},()=>Array(T).fill(0));
  const out=[];
  for(let r=0;r<rounds;r++){
    const order=shuffle([...Array(T).keys()]).sort((a,b)=>games[a]-games[b]||last[a]-last[b]);
    const active=order.slice(0,m*2);
    let bestPairs=null,bestCost=Infinity;
    for(let k=0;k<60;k++){
      const p=shuffle(active);let cost=0;const pairs=[];
      for(let i=0;i<m;i++){const a=p[2*i],b=p[2*i+1];pairs.push([a,b]);cost+=vs[a][b]*vs[a][b]+vs[a][b];}
      if(cost<bestCost){bestCost=cost;bestPairs=pairs;}
      if(cost===0)break;
    }
    bestPairs.forEach(([a,b])=>{games[a]++;games[b]++;last[a]=last[b]=r;vs[a][b]++;vs[b][a]++;});
    out.push({matches:bestPairs.map(([a,b])=>a<b?[a,b]:[b,a]).sort((x,y)=>x[0]-y[0]),rest:[...Array(T).keys()].filter(t=>!active.includes(t))});
  }
  let pairMax=0,pairMin=Infinity;
  for(let a=0;a<T;a++)for(let b=a+1;b<T;b++){pairMax=Math.max(pairMax,vs[a][b]);pairMin=Math.min(pairMin,vs[a][b]);}
  const spread=Math.max(...games)-Math.min(...games);
  return {rounds:out,games,score:spread*1000+(pairMax-pairMin)};
}
// LOGIC_END

/* ===== 画面 ===== */
const $=id=>document.getElementById(id);
const state={teams:4,courts:2,rounds:4};
const LIM={teams:[2,20],courts:[1,10],rounds:[1,50]};
const color=t=>`hsl(${(t*137.5)%360},55%,42%)`;

function load(){try{const s=JSON.parse(localStorage.getItem('bd2')||'null');if(s)Object.assign(state,s);}catch(e){}}
function save(){try{localStorage.setItem('bd2',JSON.stringify(state));}catch(e){}}
function refresh(){
  state.courts=Math.max(1,Math.min(state.courts,Math.floor(state.teams/2)));
  for(const k of ['teams','courts','rounds'])$('v-'+k).textContent=state[k];
  $('count').textContent=`同時に使えるコートは最大${Math.floor(state.teams/2)}面`;
  save();
}
document.querySelectorAll('.stepper button').forEach(b=>b.onclick=()=>{
  const k=b.dataset.t,[lo,hi]=LIM[k];
  const hiK=k==='courts'?Math.min(hi,Math.floor(state.teams/2)):hi;
  state[k]=Math.max(lo,Math.min(hiK,state[k]+Number(b.dataset.d)));refresh();
});

const chip=t=>`<span class="chip" style="--c:${color(t)}">チーム${t+1}</span>`;
function render(s){
  $('sched').innerHTML=s.rounds.map((r,i)=>`<div class="round"><b>第${i+1}試合</b>`+
    r.matches.map(([a,b],c)=>`<div class="match"><span class="court">コート${c+1}</span>${chip(a)}<span class="vs">VS</span>${chip(b)}</div>`).join('')+
    (r.rest.length?`<div class="rest">休み：${r.rest.map(t=>'チーム'+(t+1)).join('、')}</div>`:'')+`</div>`).join('');
  $('stats').innerHTML='<table><tr><th>チーム</th><th>試合数</th></tr>'+
    s.games.map((g,t)=>`<tr><td>チーム${t+1}</td><td>${g}</td></tr>`).join('')+'</table>'+
    `<div class="note">最大差：${Math.max(...s.games)-Math.min(...s.games)}試合</div>`;
  $('out').classList.remove('hide');
}
$('go').onclick=()=>{render(makeSchedule(state.teams,state.courts,state.rounds));$('out').scrollIntoView({behavior:'smooth'});};
load();refresh();
</script>
</body>
</html>
